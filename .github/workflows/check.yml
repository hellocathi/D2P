name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate -- --root examples examples/basic/article.md examples/complex/article.md

      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())') npm run test:e2e
